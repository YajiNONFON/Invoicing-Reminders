services:
  db:
    image: postgres:18
    container_name: invoicing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoicing
      POSTGRES_PASSWORD: invoicing
      POSTGRES_DB: invoicing
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invoicing -d invoicing']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
